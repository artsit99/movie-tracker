[package]
name = "movie_tracker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.4"

# HTTP Client
reqwest = { version = "0.11", features = ["json", "default-tls", "tokio-rustls"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }

# HTML Template Engine
askama = "0.12"

# URL Parser
url = "2.5"
httpdate = "1"
percent-encoding = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTML Parsing for Wikipedia
scraper = "0.20"

# Async Runtime
tokio = { version = "1.36", features = ["full"] }

# Regex for title cleaning
regex = "1.10"

[profile.release]
opt-level = 3
